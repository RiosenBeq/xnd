  <!-- Cookie consent (partials/cookie.html) — revealed by js/main.js when no choice is stored -->
  <div id="cookie-consent" class="fixed inset-x-4 bottom-4 z-[60] sm:left-auto sm:right-6 sm:bottom-6 sm:w-[26rem]" role="region" aria-label="Çerez bildirimi" data-i18n="cookie.region" data-i18n-attr="aria-label" hidden>
    <div class="card animate-fade-up p-5 shadow-lg">
      <div class="flex gap-3">
        <span class="icon-tile size-9"><i data-lucide="cookie" class="size-[18px]"></i></span>
        <p class="text-sm leading-relaxed text-muted-foreground">
          <span data-i18n="cookie.message">Sitemizde deneyiminizi iyileştirmek için çerezler kullanıyoruz.</span>
          <a href="/yasal#cerezler" class="font-medium text-primary underline underline-offset-4 hover:no-underline" data-i18n="cookie.link">Çerez Politikası</a>
        </p>
      </div>
      <div class="mt-4 flex gap-2">
        <button type="button" class="btn btn-outline btn-sm flex-1" data-cookie="rejected" data-i18n="cookie.reject">Reddet</button>
        <button type="button" class="btn btn-primary btn-sm flex-1" data-cookie="accepted" data-i18n="cookie.accept">Kabul Et</button>
      </div>
    </div>
  </div>
